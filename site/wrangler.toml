name = "sentinel-web"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Every request goes through the Worker first, so nothing is served without a login.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

# Cron timer: starts the paper-trading bots on time (see scheduled() in src/index.js). Times are UTC.
[triggers]
crons = ["5 11 * * 1-5", "35 12 * * 1-5", "25 19,20 * * 1-5", "40 19,20 * * 1-5"]

# User accounts + sessions
[[kv_namespaces]]
binding = "AUTH"
id = "8a3b79aa82864a9eb419d2cb334de304"

# Shared with sec-edgar-mcp: 12-hour cache of SEC financials
[[kv_namespaces]]
binding = "CACHE"
id = "f1d65bb9f24c4813a2882d5f153a455c"

# Secrets (set by .github/workflows/site.yml from GitHub repo secrets):
#   ADMIN_PASSWORD, SEC_USER_AGENT, APCA_API_KEY_ID, APCA_API_SECRET_KEY, FMP_API_KEY (optional), ADMIN_USERNAME (optional, default "admin"), GH_DISPATCH_TOKEN (starts paper bots)
