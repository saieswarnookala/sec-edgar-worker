name: Earnings drift point-in-time
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node test-earnings-drift.mjs && node test-earnings-drift-pit.mjs
      - name: Run
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: node scripts/earnings-drift-pit.mjs data
      - name: Commit
        if: always()
        run: |
          git config user.name "strategies-bot"
          git config user.email "strategies-bot@users.noreply.github.com"
          git add data/earnings_drift_pit.json || true
          git diff --cached --quiet && exit 0
          git commit -m "earnings drift pit: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
