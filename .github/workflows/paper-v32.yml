name: "Paper bot 12: Dip bot v3.2 (intraday checks)"
on:
  schedule:
    # Main clock = the Cloudflare Worker (site/src/index.js marketJobs: every 15 min + 3:50/3:55, started within seconds).
    # GitHub's own schedule (often 5-30+ min late) is only a backup for the once-a-day 3:45 step:
    - cron: '55 19,20 * * 1-5'
    - cron: '55 16,17 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1 = run but do not save state'
        default: '1'
      phase:
        description: 'force a phase for testing: intraday | final (empty = by clock)'
        default: ''
permissions:
  contents: write
concurrency: paper-v32
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node test-paper-dip.mjs
      - name: Check (virtual, no orders)
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          PHASE: ${{ inputs.phase || '' }}
        run: node scripts/paper-v32.mjs
      - name: Commit state
        if: always()
        run: |
          git config user.name "strategies-bot"
          git config user.email "strategies-bot@users.noreply.github.com"
          [ -f data/paper_v32_state.json ] && git add data/paper_v32_state.json; true
          git diff --cached --quiet && exit 0
          git commit -m "paper v3.2: $(date -u +%FT%H:%M)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
