name: "Intraday exits and entries (5-minute replay)"
on:
  workflow_dispatch:
    inputs:
      same_day:
        description: '1 = same-day selling test -> data/intraday_sameday.json'
        default: '0'
      combo:
        description: '1 = v3.1+v3.2, slots, dip size test -> data/intraday_combo.json'
        default: '0'
      v33:
        description: '1 = v3.3 (strength sizing, skip earnings dips, sector-wide 1.5x) vs v3.2 -> data/intraday_v33.json'
        default: '0'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: /tmp/*.parquet
          key: sp500data-snapshot-2026-11
      - run: pip install pandas pyarrow numpy boto3
      - name: Run
        shell: bash
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          RATE_PER_MIN: '150'
          OUT_FILE: ${{ inputs.v33 == '1' && 'data/intraday_v33.json' || inputs.combo == '1' && 'data/intraday_combo.json' || (inputs.same_day == '1' && 'data/intraday_sameday.json' || 'data/intraday_final.json') }}
          COMBO: ${{ inputs.combo || '0' }}
          V33: ${{ inputs.v33 || '0' }}
          DIP_MIN: ${{ inputs.combo == '1' && '0.09' || '0.10' }}
          SAME_DAY: ${{ inputs.same_day || '0' }}
          FAIR_VOL: '1'
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail; python -u scripts/intraday_exits.py 2>&1 | grep -v "^r2cache: loaded" | tee /tmp/run.log || { echo "::error::$(tail -c 1500 /tmp/run.log | tr "\n" " ")"; exit 1; }
      - name: Commit
        shell: bash
        run: |
          git config user.name strategies-bot && git config user.email strategies-bot@users.noreply.github.com
          git add data/intraday_*.json; git commit -qm "intraday replay results" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep 7; done; exit 1
