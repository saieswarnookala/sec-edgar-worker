name: Money working
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow numpy
      - run: python scripts/money_working.py
      - name: Commit
        if: always()
        run: |
          git config user.name strategies-bot && git config user.email strategies-bot@users.noreply.github.com
          git add data/money_working.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "money working test" && for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
