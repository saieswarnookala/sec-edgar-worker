name: India bot (before close + morning status)
# India only - separate from the US bots. Alerts go only to the NTFY_TOPIC_INDIA secret.
on:
  schedule:
    # The main alarm for the before-close run is the Cloudflare timer (09:20 / 09:40 UTC = 2:50 / 3:10 pm IST): GitHub's schedule starts late.
    - cron: '30 9 * * 1-5'            # before-close backup: 3:00 pm IST (skips itself if it already ran or the window has passed)
    - cron: '45 2 * * 1-5'            # morning status: 8:15 am IST (holdings, watchlist, account; no orders)
  workflow_dispatch:
    inputs:
      bot:
        description: 'B = before close (the India bot), morning = status message, A = next-open test (manual only)'
        default: 'B'
      force:
        description: 'Run even outside its time window / non-session day (uses the latest prices)'
        default: ''
      notify:
        description: 'Send the phone alert (yes/no)'
        default: 'yes'
permissions:
  contents: write
concurrency:
  group: india-bots
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - name: Run
        shell: bash
        env:
          MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '45 2 * * 1-5' && 'morning' || 'close') || (inputs.bot == 'morning' && 'morning' || (inputs.bot == 'A' && 'open' || 'close')) }}
          FORCE: ${{ inputs.force }}
          NO_NOTIFY: ${{ inputs.notify == 'no' && '1' || '' }}
          NTFY_TOPIC_INDIA: ${{ secrets.NTFY_TOPIC_INDIA }}
        run: |
          echo "India bot MODE=$MODE"
          set -o pipefail; python -u scripts/paper_india.py 2>&1 | tee /tmp/run.log || { echo "::error::$(tail -c 1500 /tmp/run.log | tr "\n" " ")"; exit 1; }
      - name: Commit
        shell: bash
        run: |
          git config user.name strategies-bot && git config user.email strategies-bot@users.noreply.github.com
          git add data/paper_india_state.json data/paper_india_close_state.json 2>/dev/null || true
          git commit -qm "India bots $(date -u +%F)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep 7; done; exit 1
