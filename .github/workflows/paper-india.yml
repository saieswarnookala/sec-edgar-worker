name: Paper trade India dip bot
on:
  schedule:
    - cron: '30 12 * * 1-5'     # 6:00 pm IST, after NSE close (3:30 pm) and Yahoo's end-of-day update
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if today is not an NSE session (uses the latest close)'
        default: ''
      notify:
        description: 'Send the phone alert (yes/no)'
        default: 'yes'
permissions:
  contents: write
concurrency:
  group: paper-india
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - name: Run
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
          NO_NOTIFY: ${{ inputs.notify == 'no' && '1' || '' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_INDIA: ${{ secrets.NTFY_TOPIC_INDIA }}
        run: |
          set -o pipefail; python -u scripts/paper_india.py 2>&1 | tee /tmp/run.log || { echo "::error::$(tail -c 1500 /tmp/run.log | tr "\n" " ")"; exit 1; }
      - name: Commit
        shell: bash
        run: |
          git config user.name strategies-bot && git config user.email strategies-bot@users.noreply.github.com
          git add data/paper_india_state.json 2>/dev/null || true
          git commit -qm "India paper bot $(date -u +%F)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep 7; done; exit 1
