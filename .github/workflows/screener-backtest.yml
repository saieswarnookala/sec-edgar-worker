name: Screener backtest
on:
  workflow_dispatch:
    inputs:
      mode:
        default: full
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: /tmp/*.parquet
          key: sp500data-snapshot-2026-11
      - run: pip install pandas pyarrow numpy
      - name: Run
        shell: bash
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          MODE: ${{ inputs.mode }}
        run: |
          set -o pipefail; python -u scripts/screener_backtest.py 2>&1 | tee /tmp/run.log || { echo "::error::$(tail -c 1500 /tmp/run.log | tr "\n" " ")"; exit 1; }
          echo "::notice::$(grep -vE '^frames' /tmp/run.log | tail -c 3000 | tr "\n" " ")"
      - name: Commit
        shell: bash
        run: |
          git config user.name strategies-bot && git config user.email strategies-bot@users.noreply.github.com
          git add data/screener_backtest*.json && git commit -qm "screener backtest results" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep 7; done; exit 1
