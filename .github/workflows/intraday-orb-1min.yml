name: Intraday test - opening range breakout (1-min)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy pyarrow
      - run: |
          mkdir -p parts; set -o pipefail; python -u scripts/intraday_orb_1min.py collect ${{ matrix.shard }} 2 2>&1 | tee /tmp/run.log | tee parts/log1_${{ matrix.shard }}.txt || { echo "::error::$(tail -c 1500 /tmp/run.log | tr "\n" " ")"; exit 1; }
        shell: bash
        env:
          APCA_API_KEY_ID: ${{ matrix.shard < 1 && secrets.APCA_API_KEY_ID || secrets.DIP_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ matrix.shard < 1 && secrets.APCA_API_SECRET_KEY || secrets.DIP_SECRET_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orb1-part-${{ matrix.shard }}
          path: parts/
  combine:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - uses: actions/download-artifact@v4
        with:
          path: parts/
      - run: |
          mkdir -p data/logs; cp parts/*/log1_*.txt data/logs/ 2>/dev/null || true; set -o pipefail; python -u scripts/intraday_orb_1min.py 2>&1 | tee /tmp/run.log | tee data/logs/intraday_orb_1min.log || { tail -c 1500 data/logs/intraday_orb.log | tr "\n" " " | sed "s/^/::error::/"; echo; exit 1; } || { echo "::error::$(tail -c 1500 /tmp/run.log | tr "\n" " ")"; exit 1; }
        shell: bash
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      - name: Commit
        if: always()
        shell: bash
        run: |
          git config user.name strategies-bot && git config user.email strategies-bot@users.noreply.github.com
          git add -A data/ 2>&1 || true
          echo "::warning::staged: $(git diff --cached --name-only | tr '\n' ' ')"
          git diff --cached --quiet && exit 0
          git commit -qm "intraday test: opening range breakout (1-min)"
          for i in 1 2 3 4 5; do out=$(git pull --rebase --autostash -X theirs 2>&1 && git push 2>&1) && echo "::warning::pushed" && exit 0; echo "::warning::push try $i: $(echo "$out" | tail -c 400 | tr '\n' ' ')"; sleep 7; done
          exit 1
