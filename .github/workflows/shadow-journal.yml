name: "Shadow journal (dip bot brain, log only)"
on:
  schedule:
    - cron: '30 22 * * 1-5'   # ~5:30 pm ET, after the VM hand-off at 4:50 pm ET; late runs are fine (headlines are cut at the moment each signal first appeared)
  workflow_dispatch:
permissions:
  contents: write
concurrency: shadow-journal
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run
        shell: bash
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JOURNAL_TOKEN: ${{ secrets.JOURNAL_TOKEN }}
        run: |
          DRY=1 python scripts/shadow_journal.py > /dev/null   # self-test on fake data first
          python -u scripts/shadow_journal.py
      - name: Commit
        shell: bash
        run: |
          git config user.name strategies-bot && git config user.email strategies-bot@users.noreply.github.com
          git add data/shadow_journal.json && git commit -qm "shadow journal $(date -u +%F)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep 7; done; exit 1
