name: Dip event filters
on:
  workflow_dispatch:
    inputs:
      modes:
        description: 'JSON list of event tests that need no extra data'
        default: '["ev_earn", "ev_price", "ev_market", "ev_calendar"]'
permissions:
  contents: write
jobs:
  plain:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(inputs.modes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: /tmp/*.parquet
          key: sp500data-snapshot-2026-11
      - run: pip install pandas pyarrow numpy
      - name: Run test
        shell: bash
        run: |
          set -o pipefail; python -u scripts/dip_filters.py ${{ matrix.mode }} 2>&1 | tee /tmp/run.log || { echo "::error::$(tail -c 1500 /tmp/run.log | tr "\n" " ")"; exit 1; }
      - name: Commit
        if: always()
        shell: bash
        run: |
          git config user.name strategies-bot && git config user.email strategies-bot@users.noreply.github.com
          git checkout -- data/clear_leader_long.json data/sec_events_sic.json 2>/dev/null || true
          git add data/dip_filter_${{ matrix.mode }}.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "dip event test: ${{ matrix.mode }}"
          for i in 1 2 3 4 5 6; do out=$(git pull --rebase --autostash -X theirs 2>&1 && git push 2>&1) && exit 0; echo "::warning::push try $i"; sleep $((RANDOM % 10 + 5)); done
          exit 1
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: /tmp/*.parquet
          key: sp500data-snapshot-2026-11
      - run: pip install pandas pyarrow numpy
      - name: Build 8-K items cache
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -u scripts/sec_8k_items.py
      - name: Run test
        shell: bash
        run: |
          set -o pipefail; python -u scripts/dip_filters.py ev_news 2>&1 | tee /tmp/run.log || { echo "::error::$(tail -c 1500 /tmp/run.log | tr "\n" " ")"; exit 1; }
      - name: Commit
        if: always()
        shell: bash
        run: |
          git config user.name strategies-bot && git config user.email strategies-bot@users.noreply.github.com
          git checkout -- data/clear_leader_long.json data/sec_events_sic.json 2>/dev/null || true
          git add data/dip_filter_ev_news.json data/sec_8k_items.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "dip event test: ev_news"
          for i in 1 2 3 4 5 6; do out=$(git pull --rebase --autostash -X theirs 2>&1 && git push 2>&1) && exit 0; echo "::warning::push try $i"; sleep $((RANDOM % 10 + 5)); done
          exit 1
