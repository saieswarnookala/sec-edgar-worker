name: FINRA data probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u scripts/finra_probe.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Live check of bot 8 FINRA fetch
        run: node -e "import('./scripts/paper-dip.mjs').then(async m => { const t = new Date().toISOString().slice(0,10); const r = await m.fetchShortInterest(t); if (!r) { console.log('NO FILE FOUND'); process.exit(1); } console.log('date', r.date, 'symbols', Object.keys(r.dtc).length, 'AAPL', r.dtc.AAPL, 'BRK.B', r.dtc['BRK.B'], 'filter', JSON.stringify(m.shortFilter({AAPL:-0.1,'BRK-B':-0.1,GME:-0.1}, r.dtc))); })"
