name: "India survivorship-free tests"
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'fetch | run | momrisk | momrobust | momsplit | factor | ideas3 | slowtax | brain'
        default: 'fetch'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy boto3
      - name: Run
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail; MODE=${{ inputs.mode }} python -u scripts/india_pit.py ${{ inputs.mode == 'fetch' && 'fetch' || 'run' }} 2>&1 | grep -v "^r2cache: loaded" | tee /tmp/run.log || { echo "::error::$(tail -c 1500 /tmp/run.log | tr "\n" " ")"; exit 1; }
      - name: Commit
        if: inputs.mode != 'fetch'
        shell: bash
        run: |
          git config user.name strategies-bot && git config user.email strategies-bot@users.noreply.github.com
          for f in data/india_pit.json data/india_momrisk.json data/india_momrobust.json data/india_momsplit.json data/india_factor.json data/india_ideas3.json data/india_slowtax.json data/india_brain.json; do [ -f "$f" ] && git add "$f"; done; git commit -qm "india survivorship-free results" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep 7; done; exit 1
