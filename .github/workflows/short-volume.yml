name: Short volume + dip bot test
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'check (2018-2026 vs days-to-cover) or full (2009-2026)'
        default: 'check'
      first_month:
        description: 'Optional first month YYYY-MM (smoke run)'
        default: ''
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: /tmp/*.parquet
          key: sp500data-snapshot-2026-11
      - run: pip install pandas pyarrow numpy boto3
      - name: Run
        shell: bash
        env:
          STAGE: ${{ inputs.stage }}
          FIRST_MONTH: ${{ inputs.first_month }}
          OUT: ${{ inputs.first_month == '' && format('data/short_volume_{0}.json', inputs.stage) || 'data/short_volume_smoke.json' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          [ -z "$FIRST_MONTH" ] && unset FIRST_MONTH
          set -o pipefail; python -u scripts/short_volume_dips.py 2>&1 | tee /tmp/run.log || { echo "::error::$(tail -c 1500 /tmp/run.log | tr "\n" " ")"; exit 1; }
      - name: Commit
        shell: bash
        run: |
          git config user.name strategies-bot && git config user.email strategies-bot@users.noreply.github.com
          git add data/short_volume*.json && git commit -qm "short volume dips results" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep 7; done; exit 1
