name: Dip fast crash robustness
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: /tmp/*.parquet
          key: sp500data-snapshot-2026-11
      - run: pip install pandas pyarrow numpy
      - run: python scripts/dip_fast_robust.py
      - name: Commit
        if: always()
        run: |
          git config user.name strategies-bot && git config user.email strategies-bot@users.noreply.github.com
          git checkout -- data/clear_leader_long.json 2>/dev/null || true; git add data/dip_fast_robust.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "dip clear leader parking" && for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
