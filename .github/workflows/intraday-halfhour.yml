name: Intraday test - halfhour
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - run: |
          mkdir -p data/logs; set -o pipefail; python -u scripts/intraday_halfhour.py 2>&1 | tee /tmp/run.log | tee data/logs/$(basename scripts/intraday_halfhour.py .py).log || { echo "::error::$(tail -c 1500 /tmp/run.log | tr "\n" " ")"; exit 1; }
        shell: bash
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      - name: Commit
        if: always()
        shell: bash
        run: |
          git config user.name strategies-bot && git config user.email strategies-bot@users.noreply.github.com
          git add -A data/ 2>&1 || true
          echo "::warning::staged: $(git diff --cached --name-only | tr '\n' ' ')"
          git diff --cached --quiet && exit 0
          git commit -qm "intraday test: halfhour"
          for i in 1 2 3 4 5; do out=$(git pull --rebase -X theirs 2>&1 && git push 2>&1) && echo "::warning::pushed" && exit 0; echo "::warning::push try $i: $(echo "$out" | tail -c 400 | tr '\n' ' ')"; sleep 7; done
          exit 1
