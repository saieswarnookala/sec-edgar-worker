name: Intraday test - halfhour
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - run: |
          mkdir -p data/logs; set -o pipefail; python -u scripts/intraday_halfhour.py 2>&1 | tee data/logs/$(basename scripts/intraday_halfhour.py .py).log
        shell: bash
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      - name: Commit
        if: always()
        run: |
          git config user.name strategies-bot && git config user.email strategies-bot@users.noreply.github.com
          git add data/logs/ data/intraday_halfhour*.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "intraday test: halfhour" && for i in 1 2 3 4; do git pull --rebase && git push && break; sleep 7; done
