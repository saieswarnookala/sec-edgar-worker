name: Clear leader Slack alert
on:
  schedule:
    # Only around month-end (UTC times; the script works in New York time and does nothing on other days).
    - cron: '5 19 25-31 * *'    # ~3:05 pm ET in summer (EDT) -> heads-up before the close
    - cron: '5 20 25-31 * *'    # ~3:05 pm ET in winter (EST)
    - cron: '30 21 25-31 * *'   # after the close -> final decision
    - cron: '30 22 25-31 * *'   # backup run in case GitHub starts the first one late
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = send an example message to Slack now'
        type: choice
        options: [test, auto]
        default: test
permissions:
  contents: write
concurrency:
  group: clear-leader-alert
  cancel-in-progress: false
jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node test-clear-leader-alert.mjs
      - name: Check signal and notify Slack
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/clear-leader-alert.mjs ${{ github.event.inputs.mode || 'auto' }}
      - name: Remember what was sent
        run: |
          git config user.name "strategies-bot"
          git config user.email "strategies-bot@users.noreply.github.com"
          git add data/clear_leader_state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "clear leader alert: $(date -u +%F)"
          git pull --rebase && git push
