name: "Sentinel round 9 (rally mode, dip picks, brake, earnings filter, second engine)"
on:
  workflow_dispatch:
    inputs:
      groups:
        description: 'JSON list of groups'
        required: false
        default: '["park","picks","brake","earn","engine"]'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.groups || '["park","picks","brake","earn","engine"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: /tmp/*.parquet
          key: sp500data-snapshot-2026-11
      - run: pip install pandas pyarrow numpy boto3
      - name: Run
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail; python -u scripts/sentinel_r9.py 2>&1 | grep -v "^r2cache: loaded" | tee /tmp/run.log || { echo "::error::$(tail -c 1500 /tmp/run.log | tr "\n" " ")"; exit 1; }
      - name: Commit
        shell: bash
        run: |
          git config user.name strategies-bot && git config user.email strategies-bot@users.noreply.github.com
          git add data/r9_${{ matrix.group }}.json; [ -f data/r9_series.csv.gz ] && git add data/r9_series.csv.gz; git commit -qm "round 9: ${{ matrix.group }}" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep $((5 + RANDOM % 15)); done; exit 1
