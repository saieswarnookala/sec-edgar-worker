name: Deploy website
on:
  push:
    branches: [main]
    paths: ['site/**', 'src/**', 'data/**', '.github/workflows/site.yml']
  workflow_run:
    workflows: ['Build screener', 'Build strategies', 'Build long history', 'Build India data']
    types: [completed]
  workflow_dispatch: {}
concurrency:
  group: deploy-site
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node site/test.mjs
      - name: Build
        run: node site/build.mjs
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.SENTINEL_ADMIN_PASSWORD }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::Add the CLOUDFLARE_API_TOKEN repo secret to deploy the website."; exit 0; fi
          if [ -z "$ADMIN_PASSWORD" ]; then echo "::error::Add the SENTINEL_ADMIN_PASSWORD repo secret first (the main admin login)."; exit 1; fi
          cd site
          npx -y wrangler@4.149.0 deploy
          node -e 'const o={};for(const k of ["ADMIN_PASSWORD","SEC_USER_AGENT","APCA_API_KEY_ID","APCA_API_SECRET_KEY","FMP_API_KEY"]) if(process.env[k]) o[k]=process.env[k]; require("fs").writeFileSync("/tmp/secrets.json", JSON.stringify(o)); console.log("secrets:", Object.keys(o).join(", "))'
          npx -y wrangler@4.149.0 secret bulk /tmp/secrets.json
          rm -f /tmp/secrets.json
