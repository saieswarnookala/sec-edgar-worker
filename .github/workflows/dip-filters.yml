name: Dip improvement tests
on:
  workflow_dispatch:
    inputs:
      modes:
        description: 'JSON list of tests'
        default: '["earnings", "volume", "sector", "peer", "stop"]'
permissions:
  contents: write
jobs:
  sec-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: /tmp/*.parquet
          key: sp500data-snapshot-2026-11
      - run: pip install pandas pyarrow numpy
      - name: Build SEC earnings dates + industry cache
        shell: bash
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set -o pipefail; python -u scripts/sec_events_sic.py 2>&1 | tee /tmp/run.log || { echo "::error::$(tail -c 1500 /tmp/run.log | tr "\n" " ")"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: sec-cache
          path: data/sec_events_sic.json
  test:
    needs: sec-cache
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(inputs.modes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: /tmp/*.parquet
          key: sp500data-snapshot-2026-11
      - run: pip install pandas pyarrow numpy
      - uses: actions/download-artifact@v4
        with:
          name: sec-cache
          path: data/
      - name: Run test
        shell: bash
        run: |
          set -o pipefail; python -u scripts/dip_filters.py ${{ matrix.mode }} 2>&1 | tee /tmp/run.log || { echo "::error::$(tail -c 1500 /tmp/run.log | tr "\n" " ")"; exit 1; }
      - name: Commit
        if: always()
        shell: bash
        run: |
          git config user.name strategies-bot && git config user.email strategies-bot@users.noreply.github.com
          git checkout -- data/clear_leader_long.json 2>/dev/null || true
          git add data/dip_filter_${{ matrix.mode }}.json 2>/dev/null || true
          [ "${{ matrix.mode }}" = curve ] && git add data/dip_curve.csv 2>/dev/null || true
          if [ "${{ matrix.mode }}" = earnings ]; then git add data/sec_events_sic.json 2>/dev/null || true; else git checkout -- data/sec_events_sic.json 2>/dev/null || rm -f data/sec_events_sic.json; fi
          git diff --cached --quiet && exit 0
          git commit -qm "dip improvement test: ${{ matrix.mode }}"
          for i in 1 2 3 4 5 6; do out=$(git pull --rebase --autostash -X theirs 2>&1 && git push 2>&1) && exit 0; echo "::warning::push try $i: $(echo "$out" | tail -c 300 | tr '\n' ' ')"; sleep $((RANDOM % 10 + 5)); done
          exit 1
