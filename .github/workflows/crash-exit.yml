name: Crash exit test (hourly)
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'First day (smoke run: a recent date)'
        default: '2016-01-04'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: /tmp/*.parquet
          key: sp500data-snapshot-2026-11
      - run: pip install pandas pyarrow numpy
      - name: Run
        shell: bash
        env:
          START: ${{ inputs.start }}
          OUT: ${{ inputs.start == '2016-01-04' && 'data/crash_exit.json' || 'data/crash_exit_smoke.json' }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          RATE_PER_MIN: '150'
        run: |
          set -o pipefail; python -u scripts/crash_exit.py 2>&1 | tee /tmp/run.log || { echo "::error::$(tail -c 1500 /tmp/run.log | tr "\n" " ")"; exit 1; }
      - name: Commit
        shell: bash
        run: |
          git config user.name strategies-bot && git config user.email strategies-bot@users.noreply.github.com
          git add data/crash_exit*.json && git commit -qm "crash exit results" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep 7; done; exit 1
