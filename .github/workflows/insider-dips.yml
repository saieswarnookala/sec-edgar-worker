name: Insider buying + dip bot test
on:
  workflow_dispatch:
    inputs:
      quarters:
        description: 'Comma list like 2024q1,2024q2 for a smoke run; empty = all 2006+'
        default: ''
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: /tmp/*.parquet
          key: sp500data-snapshot-2026-11
      - run: pip install pandas pyarrow numpy boto3
      - name: Run
        shell: bash
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          QUARTERS: ${{ inputs.quarters }}
          OUT: ${{ inputs.quarters == '' && 'data/insider_dips.json' || 'data/insider_dips_smoke.json' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail; python -u scripts/insider_dips.py 2>&1 | tee /tmp/run.log || { echo "::error::$(tail -c 1500 /tmp/run.log | tr "\n" " ")"; exit 1; }
      - name: Commit
        shell: bash
        run: |
          git config user.name strategies-bot && git config user.email strategies-bot@users.noreply.github.com
          git add data/insider_dips*.json && git commit -qm "insider dips results" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep 7; done; exit 1
