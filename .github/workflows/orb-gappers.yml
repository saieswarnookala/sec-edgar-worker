name: ORB gappers robustness
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        year: ['2017', '2018', '2019', '2020', '2021', '2022', '2023', '2024', '2025', '2026']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node test-orb-gappers.mjs
      - name: Run chunk
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: node scripts/orb-gappers.mjs chunk ${{ matrix.year }} out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gap-${{ matrix.year }}
          path: out/
          if-no-files-found: ignore
  merge:
    needs: chunk
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: gap-*
          merge-multiple: true
          path: chunks
      - name: Merge
        run: node scripts/orb-gappers.mjs merge chunks data
      - name: Commit
        run: |
          git config user.name "strategies-bot"
          git config user.email "strategies-bot@users.noreply.github.com"
          git add data/orb_gappers_summary.json
          git diff --cached --quiet && exit 0
          git commit -m "orb gappers: $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 15; done
