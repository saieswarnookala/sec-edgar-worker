name: Earnings drift 2004-2015
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow numpy
      - name: Run
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/earnings_drift_2004.py
      - name: Commit
        if: always()
        run: |
          git config user.name strategies-bot && git config user.email strategies-bot@users.noreply.github.com
          git add data/earnings_drift_2004_2015.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "earnings drift 2004-2015" && for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
