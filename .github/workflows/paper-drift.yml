name: Paper trade earnings drift
on:
  schedule:
    - cron: '5 12 * * 1-5'    # 7:05/8:05 ET  (GitHub often delays schedules; the script runs once per day,
    - cron: '35 12 * * 1-5'   # 7:35/8:35 ET   later runs exit if today already traded)
    - cron: '5 13 * * 1-5'    # 8:05/9:05 ET
    - cron: '20 13 * * 1-5'   # 8:20/9:20 ET
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1 = decide only, place no orders'
        default: '0'
permissions:
  contents: write
concurrency: paper-drift
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node test-paper-drift.mjs
      - name: Trade (PAPER account only)
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
        run: node scripts/paper-drift.mjs
      - name: Commit state
        if: always()
        run: |
          git config user.name "strategies-bot"
          git config user.email "strategies-bot@users.noreply.github.com"
          git add data/paper_drift_state.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "paper drift: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
