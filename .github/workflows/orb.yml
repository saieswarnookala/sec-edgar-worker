name: ORB backtest
on:
  workflow_dispatch:
    inputs:
      start:
        description: Start date (YYYY-MM-DD)
        default: '2021-01-01'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node test-orb.mjs
      - name: Run ORB backtest
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          ORB_START: ${{ inputs.start }}
        run: node scripts/build-orb.mjs data
      - name: Commit
        if: always()
        run: |
          git config user.name "strategies-bot"
          git config user.email "strategies-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "orb: $(date -u +%F)"
          git pull --rebase
          git push
