name: "Private job (encrypted)"
# Runs an encrypted script from private/jobs/<job>.py.enc with the FR_KEY secret. Nothing readable is printed:
# all output (including errors) goes into an encrypted bundle committed as private/out/<job>.tar.enc.
on:
  schedule:
    - cron: '20 22 * * 1-5'   # daily private job after the US close (catches up if GitHub runs it late)
    - cron: '0 11 2 * *'      # monthly data refresh
  workflow_dispatch:
    inputs:
      job:
        description: 'job name (file private/jobs/<job>.py.enc)'
        required: true
concurrency: private-job
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas pyarrow numpy pandas_market_calendars boto3 > /dev/null 2>&1
      - name: Run (silent)
        shell: bash
        env:
          FR_KEY: ${{ secrets.FR_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          NTFY_TOPIC_FR: ${{ secrets.NTFY_TOPIC_FR }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          JOB: ${{ inputs.job || (github.event.schedule == '0 11 2 * *' && 'fetch' || 'frpaper') }}
        run: |
          set +x
          [[ "$JOB" =~ ^[a-z0-9_]+$ ]] || { echo "bad job name"; exit 1; }
          [ -n "$FR_KEY" ] || { echo "FR_KEY secret missing"; exit 1; }
          mkdir -p /tmp/w/out private/out
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:FR_KEY -in "private/jobs/$JOB.py.enc" -out /tmp/w/job.py 2>/dev/null || { echo "decrypt failed"; exit 1; }
          python -I /tmp/w/job.py /tmp/w/out > /tmp/w/out/log.txt 2>&1; echo "exit=$?" >> /tmp/w/out/log.txt
          tar -czf /tmp/w/out.tgz -C /tmp/w out
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:FR_KEY -in /tmp/w/out.tgz -out "private/out/$JOB.tar.enc"
          rm -rf /tmp/w
          echo "done (output encrypted)"
      - name: Commit
        shell: bash
        run: |
          git config user.name strategies-bot && git config user.email strategies-bot@users.noreply.github.com
          git add private/out; [ -f data/paper_fr_public.json ] && git add data/paper_fr_public.json; git commit -qm "private job output" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep 7; done; exit 1
